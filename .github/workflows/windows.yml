name: Windows checks and portable build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
  portable:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python tools/prepare_models.py
      - run: python tools/build.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: VoxLoom-Windows-x64-Portable
          path: release/*
          compression-level: 0
